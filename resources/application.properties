spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema is managed by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=validate
#Hibernate checks that your @Entity classes match the actual database schema on startup
#If a column or table is missing it throws an error and the app won't start
#It never creates or modifies tables — that's Flyway's job here
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway — migrations live in resources/db/migration/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#resolves to target/classes/db/migration inside the jar
